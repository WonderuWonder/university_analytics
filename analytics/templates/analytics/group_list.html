{% extends 'analytics/base.html' %}
{% block breadcrumbs %}<li class="breadcrumb-item active">Группы</li>{% endblock %}

{% block content %}
<h2 class="mb-4">Список групп</h2>
<div class="card shadow-sm">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light"><tr><th>#</th><th>Название группы</th></tr></thead>
            <tbody>
                {% for group in groups %}
                <tr><td>{{ forloop.counter }}</td><td>{{ group.name }}</td></tr>
                {% empty %}
                <tr><td colspan="2" class="text-center py-4">Группы не найдены.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
